# ============================================
# Signal-Style Secure Communication Backend
# Zero Storage - Everything in Memory/Redis
# ============================================

# Server Configuration
server.port=8080
spring.application.name=signal-secure-backend

# ============================================
# NO DATABASE - Signal Philosophy
# ============================================
# We use Redis ONLY for temporary session/key storage
# Messages are NEVER stored - direct peer-to-peer
# Video calls use WebRTC - no server storage

# Redis Configuration (for temporary session data only)
# TTL set to auto-delete everything
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5

# Session TTL - Auto-delete after inactivity
session.timeout.minutes=30

# Pre-keys TTL (Signal Protocol)
prekey.ttl.days=30

# ============================================
# Security Configuration
# ============================================

# JWT Configuration
jwt.secret=your-super-secret-key-minimum-256-bits-change-this-in-production-use-env-variable
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# CORS Configuration
cors.allowed-origins=http://localhost:5173, http://localhost:3000 ,https://yourdomain.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ============================================
# WebSocket Configuration
# ============================================
websocket.allowed-origins=http://localhost:3000,https://yourdomain.com
websocket.message-size-limit=65536

# ============================================
# WebRTC Configuration (For Video Calls)
# ============================================

# STUN Servers (Free public STUN servers)
webrtc.stun.servers=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302,stun:stun2.l.google.com:19302

# TURN Server Configuration (Optional - for NAT traversal)
# You can use free TURN servers or set up your own (coturn)
webrtc.turn.enabled=false
webrtc.turn.urls=turn:your-turn-server.com:3478
webrtc.turn.username=
webrtc.turn.credential=

# Video Quality Settings
webrtc.video.max-bitrate=2500000
webrtc.video.max-framerate=30
webrtc.video.resolution=1920x1080

# ============================================
# Signal Protocol Configuration
# ============================================

# Identity Key Storage (Redis with TTL)
signal.identity-key.ttl.days=365

# Pre-Key Bundle Storage
signal.prekey-bundle.count=100
signal.signed-prekey.rotation.days=7

# ============================================
# File Transfer (Ephemeral)
# ============================================

# Files are encrypted and stored temporarily
# Auto-deleted after download or timeout
file.max-size=100MB
file.temp-storage.path=./temp-files
file.auto-delete.timeout.hours=24
file.allowed-types=image/*,video/*,audio/*,application/pdf

# ============================================
# Logging (Minimal - Privacy First)
# ============================================

# No message content logging
logging.level.root=INFO
logging.level.com.securecomm=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Do not log request/response bodies
logging.include-request-details=false

# ============================================
# Performance Configuration
# ============================================

# Thread Pool for WebSocket
websocket.thread-pool.core-size=10
websocket.thread-pool.max-size=50

# Message Queue Size
websocket.message-queue.size=1000

# ============================================
# Security Headers
# ============================================
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ============================================
# Actuator (Health Check Only)
# ============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
